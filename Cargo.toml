[package]
name = "bevy-jayzee"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["multi_threaded", "bevy_log", "bevy_state", "bevy_asset", "std", "async_executor"] }
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "enhanced-determinism", "parallel", "serialize"] }
lightyear = { version = "0.31", default-features = false, features = ["std", "client", "server", "replication", "prediction", "interpolation", "leafwing", "avian3d", "raw_connection", "udp"] }
leafwing-input-manager = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = false
debug-assertions = false
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
