[package]
name = "bevy-jayzee"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace]
members = ["."]
exclude = ["wasm-viewer"]
resolver = "3"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["multi_threaded", "bevy_log", "bevy_state", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_ui", "bevy_ui_render", "bevy_window", "bevy_winit", "bevy_gizmos_render", "tonemapping_luts", "zstd_rust", "x11", "png", "std", "async_executor", "bevy_gltf", "bevy_world_serialization", "reflect_auto_register", "ktx2", "basis-universal", "default_font"] }
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "enhanced-determinism", "parallel", "serialize", "bevy_diagnostic"] }
lightyear = { version = "0.31", default-features = false, features = ["std", "client", "server", "replication", "prediction", "interpolation", "leafwing", "avian3d", "raw_connection", "udp"] }
leafwing-input-manager = { version = "0.22", default-features = false }
meshopt = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
noise = "0.9"
png = "0.18"
rquickjs = { version = "0.14", features = ["loader", "macro"] }
ruzstd = "0.9"
bcdec_rs = "0.2.1"

[build-dependencies]
cc = "1.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = false
debug-assertions = false
strip = "symbols"

[profile.iterate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = "none"

[profile.iterate.package.bevy_pbr]
opt-level = 1

[profile.iterate.package.bevy_render]
opt-level = 1

[profile.iterate.package.basis-universal-sys]
opt-level = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = 0
